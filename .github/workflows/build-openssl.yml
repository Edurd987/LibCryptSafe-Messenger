# №44 остаток: воспроизводимая сборка OpenSSL 3.5 LTS (libcrypto.a, android-arm64).
# Только ручной запуск. Собирает ДВАЖДЫ в разных папках и падает, если хеши разошлись.
# APK здесь НЕ собирается: ключ подписи никогда не попадает в CI.
name: build-openssl-android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NDK_VERSION: "25.1.8937393"   # = NDK проекта (AGP 8.3.2), закреплено и в app/build.gradle
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: NDK ${{ env.NDK_VERSION }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Сборка A
        run: WORK="$RUNNER_TEMP/a" OUT="$GITHUB_WORKSPACE/out/openssl-3.5.9" bash scripts/build_openssl_android.sh

      - name: Сборка B (другая папка — проверка детерминизма)
        run: WORK="$RUNNER_TEMP/b/other/path" OUT="$RUNNER_TEMP/outB" bash scripts/build_openssl_android.sh

      - name: Сравнение A и B
        run: |
          A=$(sha256sum out/openssl-3.5.9/arm64-v8a/libcrypto.a | cut -d' ' -f1)
          B=$(sha256sum "$RUNNER_TEMP/outB/arm64-v8a/libcrypto.a" | cut -d' ' -f1)
          echo "A=$A"; echo "B=$B"
          [ "$A" = "$B" ] || { echo "НЕДЕТЕРМИНИРОВАННАЯ СБОРКА"; exit 1; }
          diff out/openssl-3.5.9/HEADERS.sha256 "$RUNNER_TEMP/outB/HEADERS.sha256"
          echo "ДЕТЕРМИНИЗМ OK: libcrypto.a sha256=$A"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openssl-3.5.9-android-arm64
          path: out/openssl-3.5.9
          if-no-files-found: error
