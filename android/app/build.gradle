plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp' version '1.9.22-1.0.17'
}

android {
    namespace 'com.libcryptsafe'
    compileSdk 34

    buildFeatures {
        buildConfig true   // AGP генерит BuildConfig.DEBUG (true в debug, false в release)
    }
    defaultConfig {
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        applicationId "com.libcryptsafe.messenger"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    // Боевая подпись: путь и пароль ТОЛЬКО из переменных окружения сессии
    // (LCS_KEYSTORE, LCS_KS_PASS). В файлах проекта паролей нет.
    // ОДИН пароль на хранилище и ключ — свойство формата PKCS12
    // (раздельные пароли не поддерживаются, keytool игнорирует -keypass).
    signingConfigs {
        release {
            def ks = System.getenv("LCS_KEYSTORE")
            if (ks) storeFile file(ks)
            storePassword System.getenv("LCS_KS_PASS")
            keyAlias "libcryptsafe"
            keyPassword System.getenv("LCS_KS_PASS")
        }
    }
    buildTypes {
        release {
            // ЭТАП A: minify OFF (проверяем логику без обфускации). Подпись — DEBUG-ключом
            // ТОЛЬКО ДЛЯ ТЕСТА (release ставится на телефон). Боевой keystore для Google
            // Play — отдельный pre-release шаг с надёжным хранением/бэкапом ключа.
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test:runner:1.5.2"
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // Lifecycle (для корутин в Activity)
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.biometric:biometric:1.1.0'

    // SQLCipher — шифрование локальной БД
    implementation 'net.zetetic:sqlcipher-android:4.5.6'
    implementation 'androidx.sqlite:sqlite:2.4.0'
}
